<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZeroLive - TV Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080a;--bg-elevated:#0e1015;--bg-card:#13161d;--bg-hover:#1a1e28;--accent:#0B9444;--accent-glow:rgba(11,148,68,.35);--accent-dim:rgba(11,148,68,.12);--text:#f0f2f5;--text-2:#9198a7;--text-3:#5c6372;--line:rgba(255,255,255,.06);--line-strong:rgba(255,255,255,.1);--live:#ff4757;--live-dim:rgba(255,71,87,.12);--radius:12px;--radius-sm:8px;--radius-pill:999px;--shadow:0 2px 20px rgba(0,0,0,.4)}
[data-theme="cyberpunk"]{--bg:#0d0221;--bg-elevated:#130733;--bg-card:#1a0740;--bg-hover:#240a5c;--accent:#ff2a6d;--accent-glow:rgba(255,42,109,.2);--accent-dim:rgba(255,42,109,.12);--text:#f0e6ff;--text-2:#a080cc;--text-3:#6a5090;--line:rgba(255,42,109,.12);--line-strong:rgba(255,42,109,.2);--live:#ff2a6d}
[data-theme="nord"]{--bg:#2e3440;--bg-elevated:#373e4c;--bg-card:#434c5e;--bg-hover:#4c566a;--accent:#88c0d0;--accent-glow:rgba(136,192,208,.2);--accent-dim:rgba(136,192,208,.12);--text:#eceff4;--text-2:#a0b0c0;--text-3:#6a7a90;--line:rgba(136,192,208,.12);--line-strong:rgba(136,192,208,.2);--live:#bf616a}
[data-theme="ocean"]{--bg:#050a10;--bg-elevated:#091520;--bg-card:#0f1e30;--bg-hover:#142840;--accent:#06b6d4;--accent-glow:rgba(6,182,212,.2);--accent-dim:rgba(6,182,212,.12);--text:#ecfeff;--text-2:#80c8d8;--text-3:#5090a0;--line:rgba(6,182,212,.12);--line-strong:rgba(6,182,212,.2);--live:#22d3ee}
[data-theme="midnight"]{--bg:#0a0a1a;--bg-elevated:#12122a;--bg-card:#1a1a3a;--bg-hover:#22224a;--accent:#818cf8;--accent-glow:rgba(129,140,248,.2);--accent-dim:rgba(129,140,248,.12);--text:#eef2ff;--text-2:#949dcc;--text-3:#5c6692;--line:rgba(129,140,248,.12);--line-strong:rgba(129,140,248,.2);--live:#a78bfa}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.header-left{display:flex;align-items:center;gap:16px}
.logo{font-size:18px;font-weight:900;background:linear-gradient(135deg,#fff 30%,#ff2d55,#7936f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.back{color:var(--text-2);font-size:13px;font-weight:600;text-decoration:none;transition:color .2s}
.back:hover{color:var(--text)}
.header-right{display:flex;align-items:center;gap:12px}
.search{background:var(--bg-card);border:1px solid var(--line);color:var(--text);border-radius:var(--radius-pill);padding:6px 16px;font-size:13px;font-weight:500;width:160px;outline:none;transition:border-color .2s}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--text-3)}
.theme-btn{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius-pill);padding:6px 14px;color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.theme-btn:hover{border-color:var(--line-strong);color:var(--text)}

.player-wrap{width:100%;max-width:900px;margin:0 auto;background:#000;position:relative}
.player-wrap video{width:100%;display:block;max-height:65vh}
.player-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--line);min-height:44px}
.player-bar .info{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-bar .status{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.placeholder{width:100%;text-align:center;color:var(--text-3);font-weight:600;padding:60px 20px;background:#000;border-radius:var(--radius);font-size:14px}

.categories{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line);flex-wrap:nowrap}
.cat-btn{flex-shrink:0;padding:6px 16px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--bg-card);color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-btn:hover:not(.active){border-color:var(--line-strong);color:var(--text)}

.grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 4px 16px var(--accent-glow)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.card-name{font-size:14px;font-weight:700;line-height:1.3}
.card-name .team-badge{display:inline-flex;align-items:center;gap:4px}
.card-group{font-size:11px;color:var(--text-3);font-weight:600}
.card-hidden{display:none!important}
.count{color:var(--text-3);font-size:12px;font-weight:500;margin-bottom:4px;padding:0 16px}

.toast{position:fixed;bottom:20px;right:20px;background:#c00;color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;display:none;font-weight:600;font-size:13px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);padding:10px;gap:8px}.card{padding:10px}.card-name{font-size:12px}.search{width:120px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div class="header">
  <div class="header-left">
    <a href="/" class="logo">ZEROLIVE</a>
    <a href="/" class="back">&larr; Back</a>
  </div>
  <div class="header-right">
    <input class="search" id="search" placeholder="Search..." autocomplete="off">
    <button class="theme-btn" id="themeBtn">Dark</button>
  </div>
</div>

<div class="player-wrap" id="playerWrap" style="display:none">
  <video id="video" controls playsinline preload="auto"></video>
  <div class="player-bar">
    <span class="info" id="nowPlaying">Loading...</span>
    <span class="status" id="playerStatus"><span class="spinner"></span></span>
  </div>
</div>

<div id="placeholder" class="placeholder" style="max-width:900px;margin:16px auto">Click any channel to start watching</div>

<div class="categories" id="catBar"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
(function(){
var video = document.getElementById('video');
var grid = document.getElementById('grid');
var catBar = document.getElementById('catBar');
var channels = [], activeIdx = -1, hls = null, gen = 0;

function showToast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 4000);
}

/* Theme */
var themes = ['dark','nord','cyberpunk','ocean','midnight'];
var curTheme = localStorage.getItem('zl-theme') || 'dark';
function applyTheme(t){
  curTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('zl-theme', t);
  document.getElementById('themeBtn').textContent = t.charAt(0).toUpperCase() + t.slice(1);
}
applyTheme(themes.indexOf(curTheme) >= 0 ? curTheme : 'dark');
document.getElementById('themeBtn').addEventListener('click', function(){
  var i = (themes.indexOf(curTheme) + 1) % themes.length;
  applyTheme(themes[i]);
});

/* Load */
function load(){
  fetch('/api/tv-live', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok && d.streams){
        channels = d.streams;
        render();
      }
    })
    .catch(function(e){ showToast('Failed to load: ' + e.message); });
}

/* Render */
function render(){
  var cats = {};
  channels.forEach(function(c){
    var g = c.sport || c.league || 'General';
    if(!cats[g]) cats[g] = [];
    cats[g].push(c);
  });
  var catNames = Object.keys(cats);
  catNames.sort(function(a,b){
    var order = ['Sports','Entertainment','Movies','Music','Bangladesh','News','Documentary','Cartoon','General'];
    var ai = order.indexOf(a), bi = order.indexOf(b);
    if(ai >= 0 && bi >= 0) return ai - bi;
    if(ai >= 0) return -1; if(bi >= 0) return 1;
    return a.localeCompare(b);
  });

  /* Category bar */
  var catHtml = '<button class="cat-btn active" data-cat="all">All</button>';
  catNames.forEach(function(n){
    catHtml += '<button class="cat-btn" data-cat="' + n.replace(/"/g,'&quot;') + '">' + n + '</button>';
  });
  catBar.innerHTML = catHtml;
  catBar.addEventListener('click', function(e){
    var btn = e.target.closest('.cat-btn');
    if(!btn) return;
    catBar.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    filterGrid(btn.getAttribute('data-cat'));
  });

  /* Grid */
  function buildGrid(cat){
    var h = '';
    channels.forEach(function(c, i){
      var g = c.sport || c.league || 'General';
      if(cat !== 'all' && g !== cat) return;
      var name = (c.team_a || '') + (c.team_b ? ' vs ' + c.team_b : '');
      var src = c.source || '';
      var active = i === activeIdx ? ' active' : '';
      h += '<div class="card' + active + '" data-i="' + i + '" data-search="' + (name + ' ' + src + ' ' + g).toLowerCase().replace(/"/g,'&quot;') + '">';
      h += '<div class="card-name">' + name + '</div>';
      h += '<div class="card-group">' + g + (src ? ' &middot; ' + src : '') + '</div>';
      h += '</div>';
    });
    if(!h) h = '<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-3)">No channels in this category</div>';
    grid.innerHTML = h;
    document.getElementById('count').textContent = channels.length + ' channels';
  }
  buildGrid('all');
  window._buildGrid = buildGrid;

  /* Search */
  document.getElementById('search').addEventListener('input', function(){
    var q = this.value.toLowerCase();
    var activeCat = catBar.querySelector('.cat-btn.active');
    var cat = activeCat ? activeCat.getAttribute('data-cat') : 'all';
    document.querySelectorAll('.card').forEach(function(c){
      c.classList.toggle('card-hidden', !(c.dataset.search || '').includes(q));
    });
  });
}

function filterGrid(cat){
  window._buildGrid(cat);
  var q = document.getElementById('search').value.toLowerCase();
  if(q){
    document.querySelectorAll('.card').forEach(function(c){
      c.classList.toggle('card-hidden', !(c.dataset.search || '').includes(q));
    });
  }
}

/* Play */
grid.addEventListener('click', function(e){
  var c = e.target.closest('.card');
  if(!c) return;
  var i = parseInt(c.getAttribute('data-i'), 10);
  if(!isNaN(i)) play(i);
});

function play(idx){
  if(idx < 0 || idx >= channels.length) return;
  var g = ++gen;
  var ch = channels[idx];
  activeIdx = idx;
  destroy();

  var name = (ch.team_a || '') + (ch.team_b ? ' vs ' + ch.team_b : '');
  document.getElementById('playerWrap').style.display = 'block';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('nowPlaying').textContent = 'Loading: ' + name;
  document.getElementById('playerStatus').innerHTML = '<span class="spinner"></span>';

  grid.querySelectorAll('.card').forEach(function(card){
    card.classList.toggle('active', parseInt(card.getAttribute('data-i'), 10) === idx);
  });
  window.scrollTo({top: 0, behavior: 'smooth'});

  loadStream(ch, g);
}

function destroy(){
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  video.removeAttribute('src');
  video.load();
}

function loadStream(ch, g){
  if(g !== gen) return;
  destroy();

  var url = ch.url || '';
  if(!url){ fail(g, 'No URL'); return; }

  if(Hls.isSupported() && (url.indexOf('.m3u8') > 0 || url.indexOf('.m3u') > 0)){
    hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 90 });
    var done = false;
    var timeout = setTimeout(function(){
      if(g !== gen || done) return;
      done = true; try{ hls.destroy(); }catch(e){}
      fail(g, 'Timeout loading stream');
    }, 15000);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){
      if(g !== gen) return;
      clearTimeout(timeout); done = true;
      ok(g, ch);
    });
    hls.on(Hls.Events.ERROR, function(e, data){
      if(g !== gen || done) return;
      if(data.fatal){
        clearTimeout(timeout); done = true;
        try{ hls.destroy(); }catch(e){}
        fail(g, 'Playback error: ' + (data.details || 'unknown'));
      }
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.play().catch(function(){});
    ok(g, ch);
  } else {
    video.src = url;
    video.play().catch(function(){});
    ok(g, ch);
  }
}

function ok(g, ch){
  if(g !== gen) return;
  var name = (ch.team_a || '') + (ch.team_b ? ' vs ' + ch.team_b : '');
  document.getElementById('nowPlaying').textContent = 'Playing: ' + name;
  document.getElementById('playerStatus').innerHTML = '&#10003; Live';
  video.play().catch(function(){});
}

function fail(g, msg){
  if(g !== gen) return;
  document.getElementById('nowPlaying').textContent = msg;
  document.getElementById('playerStatus').innerHTML = '&#10007;';
  showToast(msg);
}

load();
setInterval(load, 60000);
})();
</script>
</body>
</html>

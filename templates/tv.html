<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroLive - TV Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        :root,[data-theme="dark"]{--bg:#0f0f0f;--bg-card:#1a1a1a;--bg-card-hover:#222;--accent:#0B9444;--accent-glow:rgba(11,148,68,0.25);--text:#fff;--text-muted:#999;--border:#2a2a2a;--live:#ef4444}
        [data-theme="light"]{--bg:#f0f2f5;--bg-card:#fff;--bg-card-hover:#e8eaed;--accent:#0B9444;--accent-glow:rgba(11,148,68,0.2);--text:#1a1a1a;--text-muted:#666;--border:#ddd;--live:#ef4444}
        [data-theme="cyberpunk"]{--bg:#0d0221;--bg-card:#1a0740;--bg-card-hover:#240a5c;--accent:#ff2a6d;--accent-glow:rgba(255,42,109,0.2);--text:#f0e6ff;--text-muted:#a080cc;--border:#2a1050;--live:#ff2a6d}
        [data-theme="sunset"]{--bg:#1a0a00;--bg-card:#301508;--bg-card-hover:#3d1c0a;--accent:#ff6b35;--accent-glow:rgba(255,107,53,0.2);--text:#ffeedd;--text-muted:#cc9977;--border:#3d1c0a;--live:#ef4444}
        [data-theme="nord"]{--bg:#2e3440;--bg-card:#434c5e;--bg-card-hover:#4c566a;--accent:#88c0d0;--accent-glow:rgba(136,192,208,0.2);--text:#eceff4;--text-muted:#a0b0c0;--border:#4c566a;--live:#bf616a}
        [data-theme="crimson"]{--bg:#0a0508;--bg-card:#1e0f16;--bg-card-hover:#2a1520;--accent:#e11d48;--accent-glow:rgba(225,29,72,0.2);--text:#fff0f3;--text-muted:#d4a0b0;--border:#2a1520;--live:#fb7185}
        [data-theme="lavender"]{--bg:#0a080f;--bg-card:#1c1430;--bg-card-hover:#261c3e;--accent:#a78bfa;--accent-glow:rgba(167,139,250,0.2);--text:#f0ecff;--text-muted:#b8a8d8;--border:#261c3e;--live:#c084fc}
        [data-theme="ocean"]{--bg:#050a10;--bg-card:#0f1e30;--bg-card-hover:#142840;--accent:#06b6d4;--accent-glow:rgba(6,182,212,0.2);--text:#ecfeff;--text-muted:#80c8d8;--border:#142840;--live:#22d3ee}
        [data-theme="ember"]{--bg:#0a0705;--bg-card:#26160f;--bg-card-hover:#342018;--accent:#f97316;--accent-glow:rgba(249,115,22,0.2);--text:#fff7ed;--text-muted:#d4a880;--border:#342018;--live:#fb923c}
        [data-theme="sakura"]{--bg:#0a080c;--bg-card:#201624;--bg-card-hover:#2c1e30;--accent:#ec4899;--accent-glow:rgba(236,72,153,0.2);--text:#fdf2f8;--text-muted:#d8a0c0;--border:#2c1e30;--live:#f472b6}

        *{box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif}

        .navbar{background:#000;border-bottom:2px solid var(--accent)}
        .navbar-brand{color:var(--text)!important;font-weight:800;letter-spacing:-0.5px}
        .navbar-brand span{color:var(--accent)}
        .search-box{background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 16px;width:220px}
        .search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
        .search-box::placeholder{color:var(--text-muted)}

        .theme-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:5px 14px;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;position:relative}
        .theme-btn:hover{border-color:var(--accent);color:var(--text)}
        .theme-dropdown{display:none;position:absolute;right:0;top:110%;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;min-width:140px;z-index:999;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
        .theme-dropdown.open{display:block}
        .theme-dropdown button{display:block;width:100%;border:none;background:none;padding:8px 14px;color:var(--text);font-size:12px;font-weight:600;text-align:left;cursor:pointer}
        .theme-dropdown button:hover{background:var(--bg-card-hover)}
        .theme-dropdown button.active{color:var(--accent)}

        .video-container{background:#000;border-radius:10px;overflow:hidden;margin-bottom:0;box-shadow:0 0 20px var(--accent-glow)}
        video{width:100%;display:block;background:#000}

        .now-playing-bar{background:#111;padding:10px 16px;border-top:1px solid var(--accent);font-size:0.9rem}
        .now-playing-bar .spinner{width:20px;height:20px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .player-placeholder{width:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:600;padding:80px 20px;background:#000;border-radius:10px;margin-bottom:24px}

        .card{background:var(--bg-card);border:1px solid var(--border);transition:transform 0.2s,box-shadow 0.2s;cursor:pointer;border-radius:10px;overflow:hidden}
        .card:hover{transform:scale(1.04);box-shadow:0 4px 20px var(--accent-glow);border-color:var(--accent)}
        .card.hidden{display:none}
        .card.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
        .card-body-text{text-align:center;padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px}
        .badge-live{background:var(--accent);font-size:10px;font-weight:700;letter-spacing:0.5px}
        .badge-source{background:var(--live);font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px}

        .toast-error{position:fixed;bottom:20px;right:20px;background:#c00;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;display:none;font-weight:600}

        .section-title{font-weight:700;font-size:1.1rem}
        .section-count{color:var(--text-muted);font-weight:400;font-size:0.85rem}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .empty-state h5{font-weight:700;color:var(--text);margin-bottom:8px}

        .footer-text{text-align:center;padding:16px;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border);margin-top:40px}
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-3 px-md-4 mb-4">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="navbar-brand mb-0 h1 text-decoration-none">Zero<span>Live</span></a>
            <a href="/" class="text-decoration-none" style="color:var(--text-muted);font-size:13px;font-weight:600">Back</a>
        </div>
        <div class="d-flex align-items-center gap-3">
            <input class="search-box" type="text" id="searchInput" placeholder="Search streams...">
            <div class="position-relative">
                <button class="theme-btn" id="themeBtn" title="Change theme">Dark</button>
                <div class="theme-dropdown" id="themeDropdown"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div id="playerPlaceholder" class="player-placeholder">
                    Click a stream below to start watching
                </div>
                <div class="video-container" id="playerWrapper" style="display:none">
                    <video id="video" controls playsinline preload="auto"></video>
                    <div class="now-playing-bar d-flex align-items-center justify-content-between">
                        <span id="nowPlaying">Loading...</span>
                        <div id="playerStatus" class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
            <h5 class="section-title mb-0">Live Streams <span class="section-count" id="streamCount"></span></h5>
        </div>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="streamGrid"></div>
    </div>

    <div id="toast" class="toast-error"></div>
    <footer class="footer-text">ZeroLive TV Mode &mdash; Free sports streaming</footer>

    <script>
    (function(){
        if(typeof shaka!=='undefined')shaka.polyfill.installAll();
        var video=document.getElementById('video');
        var grid=document.getElementById('streamGrid');
        var streams=[], activeIdx=-1, player=null, gen=0;
        var L=function(m){try{console.log('[TV]',m)}catch(_){}};
        var E=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'\x27'}[c];})};

        /* Theme */
        var themes=['dark','light','cyberpunk','sunset','nord','crimson','lavender','ocean','ember','sakura'];
        var ti=themes.indexOf(localStorage.getItem('zl-theme')||'dark'); if(ti<0)ti=0;
        function applyTheme(t){
            document.documentElement.setAttribute('data-theme',t);
            localStorage.setItem('zl-theme',t);
            document.getElementById('themeBtn').textContent=t.charAt(0).toUpperCase()+t.slice(1);
            document.querySelectorAll('#themeDropdown button').forEach(function(b,i){
                b.classList.toggle('active',themes[i]===t);
            });
        }
        (function(){
            var dd=document.getElementById('themeDropdown');
            themes.forEach(function(t,i){
                var b=document.createElement('button');
                b.textContent=t.charAt(0).toUpperCase()+t.slice(1);
                if(i===ti)b.classList.add('active');
                b.addEventListener('click',function(){applyTheme(t);dd.classList.remove('open');});
                dd.appendChild(b);
            });
        })();
        applyTheme(themes[ti]);
        document.getElementById('themeBtn').addEventListener('click',function(e){
            e.stopPropagation();
            document.getElementById('themeDropdown').classList.toggle('open');
        });
        document.addEventListener('click',function(){document.getElementById('themeDropdown').classList.remove('open');});

        /* Toast */
        function showToast(msg){
            var t=document.getElementById('toast');
            t.textContent=msg;t.style.display='block';
            setTimeout(function(){t.style.display='none';},4000);
        }

        /* Fetch streams */
        function loadStreams(){
            fetch('/api/tv-live',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
                if(d.ok&&d.streams){streams=d.streams;L('Got '+streams.length+' streams');renderGrid();prewarm();}
            })['catch'](function(e){L('Fetch error: '+e);showToast('Failed to load streams');});
        }

        /* Proxy prewarm */
        function prewarm(){
            for(var i=0;i<Math.min(streams.length,8);i++){
                if(i===activeIdx)continue;
                (function(idx){
                    var s=streams[idx], si=s.stream_idx||0, u=s.url||'';
                    if(!u)return;
                    try{
                        var p;
                        if(s.type==='dash'||u.includes('.mpd'))p='/proxy/manifest/'+encodeURIComponent(s.slug)+'/'+si+'/';
                        else{p='/proxy/hls/'+encodeURIComponent(s.slug)+'/'+si+'/?rewrite=1';if(s.referer)p+='&referer='+encodeURIComponent(s.referer);}
                        fetch(p,{method:'HEAD',cache:'force-cache'})['catch'](function(){});
                    }catch(_){}
                })(i);
            }
        }

        /* Grid */
        function renderGrid(){
            var h='';
            for(var i=0;i<streams.length;i++){
                var s=streams[i], cur=i===activeIdx?'current':'';
                var name=E(s.team_a)+(s.team_b?' vs '+E(s.team_b):'');
                h+='<div class="col"><div class="card '+cur+'" data-i="'+i+'" data-name="'+E((s.team_a+' '+s.team_b+' '+s.sport+' '+s.league+' '+s.source).toLowerCase())+'">';
                h+='<div class="card-body-text">';
                h+='<div style="font-size:15px;font-weight:700;margin-bottom:6px">'+name+'</div>';
                h+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">'+E(s.sport)+(s.league?' \u00b7 '+E(s.league):'')+'</div>';
                h+='<span class="badge badge-source mb-2">'+E(s.source)+'</span>';
                h+='<div><span class="badge badge-live">LIVE</span></div>';
                h+='</div></div></div>';
            }
            if(!streams.length)h='<div class="col-12 empty-state"><h5>No live streams</h5><p>Check back when matches are live</p></div>';
            grid.innerHTML=h;
            document.getElementById('streamCount').textContent='('+streams.length+')';
        }

        /* Search */
        document.getElementById('searchInput').addEventListener('input',function(){
            var q=this.value.toLowerCase();
            document.querySelectorAll('.card').forEach(function(c){
                c.classList.toggle('hidden',!(c.dataset.name||'').includes(q));
            });
        });

        /* Click card */
        grid.addEventListener('click',function(e){
            var c=e.target.closest('.card');if(!c)return;
            var i=parseInt(c.getAttribute('data-i'),10);if(!isNaN(i))promote(i);
        });

        /* Promote to player */
        function promote(idx){
            if(idx<0||idx>=streams.length)return;
            var s=streams[idx], g=++gen;
            L('Promote '+idx+': '+s.team_a+(s.team_b?' vs '+s.team_b:''));
            destroyPlayer(); activeIdx=idx;

            document.getElementById('playerPlaceholder').style.display='none';
            document.getElementById('playerWrapper').style.display='block';
            document.getElementById('nowPlaying').textContent='Loading: '+s.team_a+(s.team_b?' vs '+s.team_b:'')+' ('+s.source+')';
            document.getElementById('playerStatus').className='spinner';
            window.scrollTo({top:0,behavior:'smooth'});
            renderGrid();
            loadStream(s,g);
        }

        function destroyPlayer(){
            if(player){try{if(player.destroy)player.destroy();else if(player.detachMedia)player.detachMedia();else if(player.detachMediaElement)player.detachMediaElement();else if(player.unload)player.unload();}catch(_){}player=null;}
            video.removeAttribute('src');video.load();
        }

        /* Stream loader */
        function loadStream(s,g){
            if(g!==gen)return;
            destroyPlayer();
            var url=s.url, isDash=s.type==='dash'||url.includes('.mpd'), isHls=s.type==='hls'||url.includes('.m3u8'), isTs=s.type==='mpegts';

            if(isDash){
                if(typeof shaka==='undefined'){fail(g,'Shaka not loaded');return;}
                var sp=new shaka.Player();player=sp;
                var cfg={abr:{enabled:true},streaming:{bufferingGoal:15,rebufferingGoal:5}};
                if(s.drm_kid&&s.drm_key){var k=normHex(s.drm_kid),v=normHex(s.drm_key);cfg.drm={clearKeys:{}};cfg.drm.clearKeys[k]=v;}
                sp.configure(cfg);
                sp.addEventListener('error',function(){if(g!==gen)return;L('DASH error');dashFallback(s,g);});
                var t=setTimeout(function(){if(g!==gen)return;try{sp.destroy&&sp.destroy();}catch(_){}dashFallback(s,g);},8000);
                sp.attach(video).then(function(){return sp.load(url);}).then(function(){
                    if(g!==gen)return;clearTimeout(t);ok(g,s);
                })['catch'](function(e){
                    if(g!==gen)return;clearTimeout(t);L('DASH fail: '+(e.message||e));dashFallback(s,g);
                });
            }else if(isHls){
                if(typeof Hls==='undefined'){fail(g,'HLS not supported');return;}
                var hlsUrl=url;
                if(s.needs_proxy){
                    var si=s.stream_idx||0;
                    hlsUrl='/proxy/hls/'+encodeURIComponent(s.slug)+'/'+si+'/?rewrite=1';
                    if(s.referer)hlsUrl+='&referer='+encodeURIComponent(s.referer);
                    s=Object.assign({},s,{_triedProxy:true});
                }
                loadHls(hlsUrl,s,g);
            }else if(isTs){
                if(typeof mpegts==='undefined'){fail(g,'mpegts.js not loaded');return;}
                var tp=mpegts.createPlayer({type:'mpegts',isLive:true,url:url},{enableWorker:true,enableStashBuffer:true,stashInitialSize:128,liveBufferLatencyChasing:true,liveBufferLatencyMaxLatency:5});
                tp.attachMediaElement(video);tp.load();player=tp;
                video.play().catch(function(){});ok(g,s);
            }else{
                video.src=url;player='native';
                video.play().catch(function(){});ok(g,s);
            }
        }

        function normHex(h){if(!h)return'';h=h.replace(/0x/gi,'').replace(/[^a-fA-F0-9]/g,'');return h.length===32?h:h.padStart(32,'0');}

        function dashFallback(s,g){
            if(g!==gen)return;
            if(!s.needs_proxy&&!s.drm_kid){fail(g,'Stream failed');return;}
            var si=s.stream_idx||0;
            var pUrl='/proxy/manifest/'+encodeURIComponent(s.slug)+'/'+si+'/';
            loadStream(Object.assign({},s,{url:pUrl,needs_proxy:false,_triedProxy:true}),g);
        }

        function loadHls(url,s,g){
            if(g!==gen)return;
            var si=s.stream_idx||0;
            var h=new Hls({enableWorker:true,maxBufferLength:30,maxMaxBufferLength:120,backbufferLength:30,liveSyncDuration:5,liveMaxLatencyDuration:30,startLevel:-1,liveDurationInfinity:true,lowLatencyMode:true});
            player=h;var done=false;
            var t=setTimeout(function(){
                if(done||g!==gen)return;try{h.destroy();}catch(_){}done=true;
                if(!s._triedProxy){
                    s._triedProxy=true;
                    var p='/proxy/hls/'+encodeURIComponent(s.slug)+'/'+si+'/?rewrite=1';
                    if(s.referer)p+='&referer='+encodeURIComponent(s.referer);
                    loadHls(p,s,g);
                }else fail(g,'Stream failed');
            },10000);
            h.on(Hls.Events.MANIFEST_PARSED,function(){
                if(g!==gen)return;clearTimeout(t);done=true;ok(g,s);
            });
            h.on(Hls.Events.ERROR,function(e,data){
                if(done||g!==gen)return;
                if(data.fatal){clearTimeout(t);try{h.destroy();}catch(_){}done=true;
                    if(!s._triedProxy){
                        s._triedProxy=true;
                        var p='/proxy/hls/'+encodeURIComponent(s.slug)+'/'+si+'/?rewrite=1';
                        if(s.referer)p+='&referer='+encodeURIComponent(s.referer);
                        loadHls(p,s,g);
                    }else fail(g,'Stream failed');
                }
            });
            h.attachMedia(video);h.loadSource(url);
        }

        function ok(g,s){
            if(g!==gen)return;
            document.getElementById('playerStatus').className='';
            document.getElementById('nowPlaying').textContent='Playing: '+s.team_a+(s.team_b?' vs '+s.team_b:'')+' \u00b7 '+s.source;
            video.play().catch(function(){});
        }

        function fail(g,msg){
            if(g!==gen)return;
            document.getElementById('playerStatus').className='';
            document.getElementById('nowPlaying').textContent=msg;
            showToast(msg);
        }

        loadStreams();
        setInterval(loadStreams,30000);
    })();
    </script>
</body>
</html>
